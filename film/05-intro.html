<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 Intro · RipWatch film</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/stage.css">
<style>
  :root { --scene-bg: #0a0f15; }
  #lockup { position: absolute; left: 0; top: 330px; width: 1920px; display: flex; justify-content: center; align-items: center; gap: 56px; }
  #mark { width: 240px; height: 240px; flex: none; }
  #mark svg { display: block; }
  #word { font-size: 208px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; color: var(--ink); clip-path: inset(0 100% 0 0); padding-right: 0.06em; }
  #sub { position: absolute; left: 0; top: 664px; width: 1920px; text-align: center; font-size: 54px; font-weight: 400; color: var(--ink-2); letter-spacing: -0.01em; }
</style>
</head>
<body>
<div id="stage">
  <div id="lockup">
    <div id="mark"></div>
    <div id="word">RipWatch</div>
  </div>
  <p id="sub" class="hidden">A fine-tuned computer vision model that sees rip currents.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
<script src="assets/stage.js"></script>
<script>
  const mark = document.getElementById("mark");
  mark.insertAdjacentHTML("beforeend", Film.logo(240));
  const word = document.getElementById("word");
  const lockup = document.getElementById("lockup");
  // Before the wordmark appears the mark sits centered; it slides left as the word is revealed.
  const shift = (word.offsetWidth + 56) / 2;
  gsap.set(lockup, { x: shift });
  gsap.set(mark.querySelector(".lg-fill"), { opacity: 0 });
  Film.prep([...mark.querySelectorAll(".lg-frame, .lg-w")]);

  Film.run({
    beats: [
      // 1. The mark draws itself, then the wordmark is revealed left to right.
      () => {
        const tl = gsap.timeline();
        tl.add(Film.drawLogo(mark), 0);
        tl.to(lockup, { x: 0, duration: 1.3 }, 3.0);
        tl.to(word, { clipPath: "inset(0 0% 0 0)", duration: 1.3, ease: "power2.inOut" }, 3.0);
        return tl;
      },
      // 2. The line that says what it is.
      () => Film.rise("#sub", { duration: 1.1 }),
    ],
  });
</script>
</body>
</html>
